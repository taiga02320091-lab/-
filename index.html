<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5分刻みルーティン表</title>
    <!-- PWA用設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <header class="bg-indigo-600 text-white p-4 sticky top-0 z-10 shadow-md">
        <h1 class="text-lg font-bold text-center">ルーティン管理</h1>
    </header>

    <main class="max-w-md mx-auto p-4">
        <!-- 曜日タブ -->
        <div class="flex overflow-x-auto space-x-1 bg-white p-2 rounded-xl shadow-sm mb-4">
            <button onclick="changeDay(0)" id="day-0" class="day-btn flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white whitespace-nowrap">月</button>
            <button onclick="changeDay(1)" id="day-1" class="day-btn flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 whitespace-nowrap">火</button>
            <button onclick="changeDay(2)" id="day-2" class="day-btn flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 whitespace-nowrap">水</button>
            <button onclick="changeDay(3)" id="day-3" class="day-btn flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 whitespace-nowrap">木</button>
            <button onclick="changeDay(4)" id="day-4" class="day-btn flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 whitespace-nowrap">金</button>
            <button onclick="changeDay(5)" id="day-5" class="day-btn flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 whitespace-nowrap">土</button>
            <button onclick="changeDay(6)" id="day-6" class="day-btn flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 whitespace-nowrap">日</button>
        </div>

        <!-- ルーティン追加フォーム -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6">
            <h2 class="text-sm font-bold mb-3 text-gray-700">新しいルーティンを追加</h2>
            <div class="space-y-3">
                <input type="text" id="title" placeholder="やること（例：ストレッチ）" class="w-full p-2 border rounded-lg text-sm">
                <div class="flex space-x-2">
                    <select id="time" class="w-1/2 p-2 border rounded-lg text-sm bg-white"></select>
                    <button onclick="addRoutine()" class="w-1/2 bg-indigo-600 text-white font-bold py-2 rounded-lg text-sm">追加する</button>
                </div>
            </div>
        </div>

        <!-- ルーティンリスト -->
        <div class="bg-white p-4 rounded-xl shadow-sm">
            <h2 id="current-day-label" class="text-sm font-bold mb-3 text-gray-700">月曜日のルーティン</h2>
            <div id="routine-list" class="space-y-2">
                <!-- 動的に挿入 -->
            </div>
        </div>
    </main>

    <script>
        const days = ['月', '火', '水', '木', '金', '土', '日'];
        let currentDay = 0;
        let routines = JSON.parse(localStorage.getItem('routines') || '[]');

        // 5分刻みのセレクトボックスを生成
        const timeSelect = document.getElementById('time');
        for (let h = 0; h < 24; h++) {
            for (let m = 0; m < 60; m += 5) {
                const hourStr = String(h).padStart(2, '0');
                const minStr = String(m).padStart(2, '0');
                const timeStr = `${hourStr}:${minStr}`;
                const opt = document.createElement('option');
                opt.value = timeStr;
                opt.textContent = timeStr;
                timeSelect.appendChild(opt);
            }
        }

        function changeDay(dayIndex) {
            currentDay = dayIndex;
            document.querySelectorAll('.day-btn').forEach((btn, idx) => {
                if (idx === dayIndex) {
                    btn.className = "day-btn flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white whitespace-nowrap";
                } else {
                    btn.className = "day-btn flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 whitespace-nowrap";
                }
            });
            document.getElementById('current-day-label').textContent = `${days[dayIndex]}曜日のルーティン`;
            renderRoutines();
        }

        function addRoutine() {
            const title = document.getElementById('title').value;
            const time = document.getElementById('time').value;
            if (!title) return alert('やることが入力されていません');

            routines.push({ day: currentDay, time, title });
            routines.sort((a, b) => a.time.localeCompare(b.time));
            localStorage.setItem('routines', JSON.stringify(routines));
            
            document.getElementById('title').value = '';
            renderRoutines();
        }

        function deleteRoutine(index) {
            const target = filteredRoutines()[index];
            routines = routines.filter(r => r !== target);
            localStorage.setItem('routines', JSON.stringify(routines));
            renderRoutines();
        }

        function filteredRoutines() {
            return routines.filter(r => r.day === currentDay);
        }

        function renderRoutines() {
            const list = document.getElementById('routine-list');
            const targetRoutines = filteredRoutines();
            if (targetRoutines.length === 0) {
                list.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">ルーティンが登録されていません</p>';
                return;
            }
            list.innerHTML = targetRoutines.map((r, i) => `
                <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-100">
                    <div class="flex items-center space-x-3">
                        <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">${r.time}</span>
                        <span class="text-sm">${r.title}</span>
                    </div>
                    <button onclick="deleteRoutine(${i})" class="text-gray-400 hover:text-red-500 text-xs">削除</button>
                </div>
            `).join('');
        }

        renderRoutines();

        // Service Worker登録
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
